# OpenSSF Scorecard: an outside check of the repository's security habits (pinned dependencies, branch protection,
# token permissions, code review and more). It publishes the score shown by the badge in the README and posts its
# findings in the Security tab. Scorecard only scores public repositories, so the job skips itself while this one is
# private. It runs on each push to main, which happens at least daily (the data refresh), and by hand.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
