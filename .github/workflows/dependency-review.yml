# On every pull request, refuses a new or updated dependency with a known high or critical vulnerability. Dependency
# review is free for public repositories, so the job skips itself while the repository is private.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
