name: Regenerate brand files once
on:
  push:
    branches: [brand-regen]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run brand
      - run: npm run api
      - name: Commit the regenerated files and remove this one-off workflow
        run: |
          git rm -q .github/workflows/regen-brand-once.yml
          git add -A
          git -c user.name=sk -c user.email=163672792+skirberg@users.noreply.github.com commit -m "Regenerate brand files and share cards on Linux"
          git push origin HEAD:brand-regen
