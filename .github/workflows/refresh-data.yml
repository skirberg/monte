# Keeps the Election night market prices current with nobody checking in.
# Once a day it runs scripts/fetch-markets.mjs (public APIs, no keys). If lib/play/data/markets.json
# changed, it commits the file and pushes to main; that push starts the usual Vercel deploy.
name: Refresh data

on:
  schedule:
    - cron: "7 12 * * *" # daily, about 12:00 UTC (off the hour, when GitHub's queue is busiest)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch market prices
        run: node scripts/fetch-markets.mjs

      - name: Commit and push if the prices changed
        run: |
          if git diff --quiet -- lib/play/data/markets.json; then
            echo "No change in market prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/play/data/markets.json
          git commit -m "Refresh market prices"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
