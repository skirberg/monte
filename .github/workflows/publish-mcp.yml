# Lists Monte's MCP server (mcp.monte.markets) on the official MCP Registry, which Glama and other
# directories copy from. Runs when server.json changes on main, or by hand from the Actions tab.
# GitHub vouches for the repo (OIDC), so there is no key or secret; the listing name is io.github.skirberg/monte.
# Steps follow the registry's guide: https://modelcontextprotocol.io/registry/github-actions
# To publish a change: bump "version" in server.json and merge.
name: Publish MCP server

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

# Read-only by default; the publish job adds only the OIDC token it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Check the server answers
        run: curl --fail --silent --show-error --max-time 20 https://mcp.monte.markets/mcp > /dev/null

      - name: Sign in to the registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
