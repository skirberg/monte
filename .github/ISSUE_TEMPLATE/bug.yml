name: Something is broken
description: A page that fails, a layout that overlaps, or a button that does nothing.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://monte.markets/daily/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 16, Safari
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if you have one.
